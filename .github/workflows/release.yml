name: Release @flaxia/mail-contract

# The contract is never pushed to a package registry. A `contract-v*` tag
# produces a GitHub Release whose asset is the tarball Flaxia vendors from
# `flaxia/vendor/`.

on:
  push:
    tags: ['contract-v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Build the contract
        run: npm run build
      - name: dist/ must be committed
        run: git diff --exit-code -- dist
      - run: npm test

      - name: Resolve release tag and asset name
        id: meta
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "$tag" != "contract-v${version}" ]; then
              echo "tag $tag does not match package.json version $version" >&2
              exit 1
            fi
          else
            tag="contract-v${version}"
          fi
          printf 'version=%s\ntag=%s\nasset=flaxia-mail-contract-%s.tgz\n' \
            "$version" "$tag" "$version" >> "$GITHUB_OUTPUT"

      - name: Pack the tarball
        run: |
          set -euo pipefail
          npm pack
          test -f '${{ steps.meta.outputs.asset }}'

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "@flaxia/mail-contract ${TAG#contract-v}" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$ASSET" --clobber

      - name: Summarize
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -euo pipefail
          {
            echo "### @flaxia/mail-contract tarball"
            echo
            echo "- Release: \`$TAG\`"
            echo "- Asset: \`$ASSET\`"
            echo
            echo '```sh'
            echo "# in flaxia"
            echo "cp ../flaxia-mail/$ASSET vendor/"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
